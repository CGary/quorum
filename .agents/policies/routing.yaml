# Routing rules for phase=implement, expressed as an explicit {risk x band}
# matrix (max-severity: level = max(risk_level, band_level); low/S=0,
# medium/M=1, mixed-high=2, and since 2026-08-26 {high,L} + catch-all +
# migration/security promote to level 3). Every (risk, band) pair matches exactly one cell, so
# rule order is irrelevant within the matrix. A trailing catch-all rule (empty
# match) is the safe default for any non-implement phase or unanticipated value,
# so core.Route never hits its structural "no matching rule" error.
# Cost, retries, and escalation are dispatcher-controlled, not agent-controlled.
rules:
  # low/S -> level 0 (the ratified G1 cheap cell).
  - match: {phase: implement, risk: low, band: S}
    executor_level: 0
    reviewer_required: true
    # max_attempts is the reroute BUDGET (jumps), not the attempt count: budget
    # B reaches B+1 cells.
    # >>> SUPERSEDED 2026-09-09. The original rationale was "N-1 jumps so the
    # >>> WHOLE level-0 chain is reachable (5 cells -> 4 jumps)... level 0 is the
    # >>> only level on an independent quota (OpenRouter free)". Both premises
    # >>> are gone: level 0 now has exactly TWO cells (config.yaml), and there is
    # >>> no independent quota class anywhere — every routed cell is on the one
    # >>> OpenCode Go subscription.
    # The value is deliberately LEFT at 4 rather than lowered to 1, following the
    # same precedent recorded for level 2 on 2026-08-27: a surplus jump is inert
    # (the router simply returns no_viable_candidate once the chain is exhausted)
    # and it leaves room to add a third or fourth cell without touching this
    # file. What it is NOT any more is a claim that four cells exist here.
    # Worst case before the level blocks: 2 real attempts at 600s = ~20 min.
    max_attempts: 4

  # medium-or-M cells -> level 1.
  - match: {phase: implement, risk: low, band: M}
    executor_level: 1
    reviewer_required: true
    max_attempts: 2
  - match: {phase: implement, risk: medium, band: S}
    executor_level: 1
    reviewer_required: true
    max_attempts: 2
  - match: {phase: implement, risk: medium, band: M}
    executor_level: 1
    reviewer_required: true
    max_attempts: 2

  # high-or-L cells -> level 2. 2026-08-09 (human decision, v2 auto-dispatch):
  # human_gate_required flipped to false across the matrix — dispatch decisions
  # are displayed, not confirmed. The catch-all and type_overrides below keep
  # their gates as safe defaults for unanticipated values and for
  # migration/security work.
  - match: {phase: implement, risk: low, band: L}
    executor_level: 2
    reviewer_required: true
    max_attempts: 2
    human_gate_required: false
  - match: {phase: implement, risk: medium, band: L}
    executor_level: 2
    reviewer_required: true
    max_attempts: 2
    human_gate_required: false
  - match: {phase: implement, risk: high, band: S}
    executor_level: 2
    reviewer_required: true
    max_attempts: 2
    human_gate_required: false
  - match: {phase: implement, risk: high, band: M}
    executor_level: 2
    reviewer_required: true
    max_attempts: 2
    human_gate_required: false
# {high, L} promotes to level 3 (critical tier).
  # 2026-08-26 put a human gate on every rule that reaches level 3 — critical
  # dispatches confirmed, not just displayed. 2026-09-09 (human decision)
  # REMOVES it: level 3 now behaves exactly like levels 0-2.
  # Two reasons, one of them a defect: (1) the human asked for uniform
  # behaviour across levels; (2) the gate was never enforced anywhere.
  # cmd/fleet_route.go states that reviewer_required / human_gate_required /
  # type_overrides / routes are silently ignored by the router, and
  # q-dispatch/SKILL.md gates only on a codex candidate, never on this flag.
  # Leaving it true documented a control the system did not implement, which
  # is worse than not having it. If a gate is wanted again it has to be built
  # in core.Route + q-dispatch first, and only then declared here.
  - match: {phase: implement, risk: high, band: L}
    executor_level: 3
    reviewer_required: true
    max_attempts: 2
    human_gate_required: false

  # Catch-all safe default (any non-implement phase or unanticipated value).
  # 2026-08-26: promoted to level 3 with the ladder rebalance.
  # 2026-09-09: gate removed (see the note on {high, L} above).
  - match: {}
    executor_level: 3
    reviewer_required: true
    max_attempts: 2
    human_gate_required: false

# 2026-09-09: gates removed here too (see the note on {high, L} above). These
# overrides still carry reviewer_required, which IS honored downstream.
type_overrides:
  migration:
    reviewer_required: true
    human_gate_required: false
  security:
    reviewer_required: true
    human_gate_required: false

routes:
  default: [context, executor_L0, verify, reviewer_L1, before_merge]
