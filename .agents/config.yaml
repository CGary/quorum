levels:
  0:
    use_for:
      - feature_execution
      - tests
      - docs
      - mechanical_refactor
    primary: google/gemini-3.6-flash-low
    # The 3.5 cells stay exposed for fleet run but become unrouted.
    # G1-ratified: reroute is always cross-provider free-to-agy. core.Route
    # enumerates primary, then fallback, then secondary[...] in that fixed
    # order (internal/core/fleet_route.go enumerateCandidates) -- so the
    # FIRST reroute candidate after primary is excluded MUST be a
    # cross-provider (opencode-backed, $0 OpenRouter free tier) cell, never
    # another agy-provided model. fallback therefore holds the cross-provider
    # secondary; the agy-provided openai/gpt-oss-120b fallback moves into
    # secondary, reached only after both cross-provider cells are excluded.
    fallback: nvidia/nemotron-3-ultra-550b-a55b-free
    secondary:
      - poolside/laguna-m.1-free
      - openai/gpt-oss-120b
    # max_cost_per_call_usd only binds transports with quota_class: api (ADR-A).
    max_cost_per_call_usd: 0.15

  1:
    use_for:
      - review
      - diagnose_verify_failure
      - small_corrections
    # Rebuilt 2026-07-31 after the hexcell-2 audit: this level owns {low,M},
    # {medium,S} and {medium,M} -- the band most SDC tasks land in -- yet its
    # chain resolved to nothing routable (codex disabled by kill-switch since
    # 2026-07-27; the old google/gemini-3.1-pro-low fallback lives only on the
    # oneshot `agy` transport, which core.Route excludes from implement), so
    # every level-1 implement fell back to an internal Claude subagent.
    primary: google/gemini-3.6-flash-medium
    # Same G1 invariant as level 0: the FIRST reroute candidate after the
    # primary is excluded MUST be cross-provider (opencode-backed, $0
    # OpenRouter free tier), never another agy_edit-provided model.
    fallback: poolside/laguna-m.1-free
    # Second cross-provider free cell, then the agy-provided gpt-oss-120b.
    # The codex cells stay reachable but last: that account is retired
    # (kill-switch 2026-07-27) and its free credits are finite. gpt-5.6
    # terra/luna keep the human-given order; no capability ranking asserted.
    secondary:
      - nvidia/nemotron-3-ultra-550b-a55b-free
      - openai/gpt-oss-120b
      - openai/gpt-5.5-medium
      - openai/gpt-5.6-terra-medium
      - openai/gpt-5.6-luna-medium
    max_cost_per_call_usd: 0.50

  2:
    use_for:
      - surgical_cartography
      - high_risk_arch
      - ambiguous_features
      - migrations
      - security
    primary: anthropic/claude-opus-4-6
    # Resolves via agy_edit (agentic, subscription) since 2026-07-31.
    fallback: openai/gpt-5.5-high
    # Same ordering rationale as level 1: human-given order, no ranking claim.
    secondary:
      - openai/gpt-5.6-terra-high
      - openai/gpt-5.6-luna-high
    max_cost_per_call_usd: 3.00
    requires_human_gate: true

policies:
  max_attempts_default: 2
  cost_bounded_by_dispatcher: true
  system_commits: true
  human_merges: true
  # Deterministic transport preference order consumed by `quorum fleet route`
  # when building the ordered candidate transport slice. Expresses the
  # cross-provider reroute preference as DATA (not Go): agy_edit first so the
  # gemini-3.6-flash models it exposes resolve to the agentic-editing variant
  # (agy stays next and keeps owning every other gemini model for one-shot
  # review/analysis), opencode before aider (cross-provider before the
  # mechanical-single-file fallback), then codex (reactivated 2026-07-22 on
  # finite free-tier credits) and claude (inactive) last.
  # A transport absent from this list is unreachable via `fleet route`.
  fleet_transport_order:
    - agy_edit
    - agy
    - opencode
    - aider
    - codex
    - claude
