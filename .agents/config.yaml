# Executor levels (ADR 0010): the POLICY half of routing. agents.yaml says how
# to invoke a CLI; this file says which cell each level enters on. Model names
# join agents.yaml by exact string match and never appear as Go literals.
#
# 2026-09-09 (human decision) -- FULL LADDER REBUILD ON OPENCODE GO.
# What changed and why:
#   * The Antigravity/Gemini subscription is GONE (same as codex 2026-07-27).
#     Every google/* cell is unrouted; agy and agy_edit are kill-switched in
#     .ai/fleet-control.json and active:false in agents.yaml. That also retires
#     anthropic/claude-{sonnet,opus}-4-6, which existed ONLY on agy_edit.
#   * The $0 OpenRouter cells (nvidia/*, cohere/*, poolside/*) are unrouted and
#     their transports (opencode, aider) are active:false -- human decision the
#     same day, "quitar los modelos free".
#   * What remains is ONE live transport: opencode_go (OpenCode Go
#     subscription). The ladder below is the human's own 8-cell ordering.
#
# Shape: four levels, exactly two cells each (primary -> fallback), no
# secondary anywhere. An exhausted chain BLOCKS and returns to the human --
# there is no free tail and no Claude rescuer left to degrade into.
#
# ACCEPTED RISK ON RECORD (human decision): every cell hangs off the SAME
# subscription. Each level is still cross-FAMILY by construction (deepseek ->
# alibaba, minimax -> tencent, deepseek -> moonshot, moonshot -> xai), which is
# what the G1 test asserts, but an exhausted OpenCode Go quota blocks the whole
# fleet at once. There is no independent quota class anywhere in the ladder.
#
# EVIDENCE STATUS (human decision, "rutear las 8 igual, smoke solo
# informativo"): only opencode-go/deepseek-v4-pro carries agentic smoke
# evidence (pass@10 = 10/10, 2026-09-07, docs/fleet-run-for-agents.md 7.8).
# The other seven are routed by decision; the smoke campaign runs alongside and
# DOCUMENTS rather than gates. This is a deliberate, recorded exception to the
# proven-before-new rule in CLAUDE.md -- the same exception taken on 2026-09-08.
#
# Pre-2026-09-09 per-level causal traces were removed together with the cells
# they described: every model routed before this date lives on a retired
# subscription or a deactivated transport, so the notes documented ordering
# decisions among cells that no longer exist. They remain recoverable in git
# (commit aab5927 and earlier) and the dated narrative survives in AGENTS.md /
# CLAUDE.md.
levels:
  0:
    use_for:
      - feature_execution
      - tests
      - docs
      - mechanical_refactor
    primary: opencode-go/deepseek-v4-flash
    fallback: opencode-go/qwen3.8-flash
    # max_cost_per_call_usd only binds transports with quota_class: api
    # (ADR-A). Every routed cell is now quota_class: subscription, so this
    # bound is inert -- kept so re-introducing an api transport is a one-line
    # change, not a schema change.
    max_cost_per_call_usd: 0.15

  1:
    use_for:
      - review
      - diagnose_verify_failure
      - small_corrections
    primary: opencode-go/minimax-m3
    fallback: opencode-go/hy3
    max_cost_per_call_usd: 0.50

  2:
    use_for:
      - surgical_cartography
      - high_risk_arch
      - ambiguous_features
    primary: opencode-go/deepseek-v4-pro
    fallback: opencode-go/kimi-k2.7-code
    max_cost_per_call_usd: 3.00
    requires_human_gate: false

  3:
    use_for:
      - migrations
      - security
      - critical_high_risk_large
    primary: opencode-go/kimi-k3
    fallback: opencode-go/grok-4.6
    max_cost_per_call_usd: 3.00
    # 2026-09-09 (human decision): level 3 behaves exactly like the others.
    # The matching human_gate_required flags in routing.yaml were flipped to
    # false the same day -- they were policy data no code ever read
    # (cmd/fleet_route.go documents reviewer_required / human_gate_required /
    # type_overrides / routes as silently ignored), so the gate was a promise
    # the system did not keep. Removing it makes the data honest.
    requires_human_gate: false

policies:
  max_attempts_default: 2
  cost_bounded_by_dispatcher: true
  system_commits: true
  human_merges: true
  # Deterministic transport preference order consumed by `quorum fleet route`
  # when building the ordered candidate transport slice. A transport absent
  # from this list is unreachable via `fleet route`.
  # 2026-09-09: reduced to the only live transport plus claude (declared,
  # active:false, kept for future activation per ADR 0010 section 5). agy,
  # agy_edit, opencode, aider and codex are retired -- kill-switched and/or
  # active:false -- and are deliberately NOT listed.
  fleet_transport_order:
    - opencode_go
    - claude
