levels:
  0:
    use_for:
      - feature_execution
      - tests
      - docs
      - mechanical_refactor
    # 2026-08-09 (human decision, free-first ordering): the $0 OpenRouter
    # free cells lead the chain and the Gemini-subscription cells close it,
    # preserving subscription quota for interactive/orchestration use.
    # NOTE: this supersedes the earlier G1 note that required the fallback
    # to be cross-provider from the primary -- primary and fallback are now
    # BOTH opencode/OpenRouter free cells (shared 20 req/min + daily quota,
    # a rate-limit hits both together); the cross-provider jump now happens
    # at secondary (agy_edit, subscription). core.Route still enumerates
    # primary -> fallback -> secondary in fixed order.
    # 3.5-flash-low is exposed on agy_edit (agentic smoke pass 2026-08-09)
    # and sits LAST as the subscription backstop.
    # 2026-08-09: laguna-m.1 was removed from OpenRouter (2.1 series replaced
    # it; probes errored) -> swapped for poolside/laguna-s-2.1-free here and
    # in level 1.
    # 2026-08-26 (human ladder rebalance, 4-level matrix): free cells lead,
    # gpt-oss-120b (subscription) closes as the only backstop. No Claude
    # rescuer at this level: exhausting 4 cells on a trivial task should
    # surface as blocked -> human, not burn strong quota. laguna-xs added
    # after agentic smoke (2026-08-26 campaign). 3.5-flash-low unrouted
    # (stays in catalogs for fleet run).
    primary: nvidia/nemotron-3-ultra-550b-a55b-free
    fallback: poolside/laguna-s-2.1-free
    secondary:
      - poolside/laguna-xs-2.1-free
      - openai/gpt-oss-120b
    # max_cost_per_call_usd only binds transports with quota_class: api (ADR-A).
    max_cost_per_call_usd: 0.15

  1:
    use_for:
      - review
      - diagnose_verify_failure
      - small_corrections
    # Rebuilt 2026-07-31 after the hexcell-2 audit: this level owns {low,M},
    # {medium,S} and {medium,M} -- the band most SDC tasks land in -- yet its
    # chain resolved to nothing routable (codex disabled by kill-switch since
    # 2026-07-27; the old google/gemini-3.1-pro-low fallback lives only on the
    # oneshot `agy` transport, which core.Route excludes from implement), so
    # every level-1 implement fell back to an internal Claude subagent.
    # 2026-08-09 (human decision, free-first ordering): same rationale as
    # level 0 -- $0 OpenRouter free cells lead, the Gemini-subscription
    # cell (3.6-flash-low) closes the live chain as the subscription
    # backstop. 3.6-flash-medium stays in the agy/agy_edit catalogs for
    # fleet run but is no longer routed. Primary/fallback are both
    # opencode/OpenRouter (shared rate limit); cross-provider jump happens
    # at secondary. The codex cells stay reachable but last: that account
    # is retired (kill-switch 2026-07-27) and its free credits are finite.
    # 2026-08-26 (human ladder rebalance, 4-level matrix): free opens, flash
    # 3.6 escalates effort, and the Anthropic pair closes as rare rescuers
    # ("los baratos hacen el grueso, Claude rescata al final") -- a tail cell
    # only runs after every cheaper cell FAILED the same task, so its
    # expected cost is near zero. Codex cells removed from routing
    # (subscription retired, human decision 2026-08-26; catalog entries and
    # kill-switch state untouched).
    primary: poolside/laguna-s-2.1-free
    fallback: openai/gpt-oss-120b
    secondary:
      - google/gemini-3.6-flash-low
      - google/gemini-3.6-flash-medium
      - anthropic/claude-sonnet-4-6
      - anthropic/claude-opus-4-6
    max_cost_per_call_usd: 0.50

  2:
    use_for:
      - surgical_cartography
      - high_risk_arch
      - ambiguous_features
    # 2026-08-26 (human ladder rebalance, 4-level matrix): dangerous-or-large
    # work (high+S/M, low/medium+L). Enters on 3.6-flash-high (proven cell)
    # and escalates into the new 3.7 trio ("mas nuevo != mejor hasta que el
    # ledger lo diga": 3.7 earns promotion with evidence, like 3.6 did).
    # One model, one home (human rule 2026-08-26): no Claude duplicate here
    # -- an exhausted chain surfaces as blocked -> human. Codex cells removed
    # from routing (subscription retired).
    primary: google/gemini-3.6-flash-high
    fallback: google/gemini-3.7-flash-low
    secondary:
      - google/gemini-3.7-flash-medium
    max_cost_per_call_usd: 3.00
    # 2026-08-09 (human decision, v2 auto-dispatch): flipped to false — the
    # router's decision is displayed, never confirmed, at every level. Narrow
    # exceptions live in q-dispatch/q-orchestrate: codex candidates (finite
    # credits) and migration/security type_overrides in routing.yaml.
    requires_human_gate: false

  3:
    use_for:
      - migrations
      - security
      - critical_high_risk_large
    # 2026-08-26 (human ladder rebalance): new top level for {high, L}, the
    # catch-all, and migration/security type_overrides. Led by 3.7-flash-high
    # (flash series has the track record; 3.1-pro is the least-proven cell of
    # the batch, so it serves as fallback, not primary -- human decision).
    # No Claude cell and no free tail: for critical work, exhausting the
    # chain must BLOCK and return to the human, never degrade silently.
    # Routing.yaml puts human_gate_required: true on every cell that maps
    # here.
    primary: google/gemini-3.7-flash-high
    fallback: google/gemini-3.1-pro-low
    secondary:
      - google/gemini-3.1-pro-high
    max_cost_per_call_usd: 3.00
    requires_human_gate: false

policies:
  max_attempts_default: 2
  cost_bounded_by_dispatcher: true
  system_commits: true
  human_merges: true
  # Deterministic transport preference order consumed by `quorum fleet route`
  # when building the ordered candidate transport slice. Expresses the
  # cross-provider reroute preference as DATA (not Go): agy_edit first so the
  # gemini-3.6-flash models it exposes resolve to the agentic-editing variant
  # (agy stays next and keeps owning every other gemini model for one-shot
  # review/analysis), opencode before aider (cross-provider before the
  # mechanical-single-file fallback), then codex (reactivated 2026-07-22 on
  # finite free-tier credits) and claude (inactive) last.
  # A transport absent from this list is unreachable via `fleet route`.
  fleet_transport_order:
    - agy_edit
    - agy
    - opencode
    - aider
    - codex
    - claude
